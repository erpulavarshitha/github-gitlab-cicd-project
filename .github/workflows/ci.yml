
name: GitHub to GitLab CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub code
        uses: actions/checkout@v4

      - name: Build check
        run: |
          echo "Build check started"
          test -f README.md
          test -f index.html
          echo "Build check successful"

      - name: Test check
        run: |
          grep -q "github-gitlab-cicd-project" README.md
          echo "Test passed successfully"

      - name: Push code to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add gitlab https://gitlab.com/gitlab-devops-project1/github-gitlab-cicd-project.git
          git -c http.extraHeader="Authorization: Bearer ${GITLAB_TOKEN}" push gitlab HEAD:main
